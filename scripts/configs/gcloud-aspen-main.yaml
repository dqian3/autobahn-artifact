platform: gcloud

# Targets the same VMs as aspen-bft's scripts/bench_scripts/configs/gcloud-aspen-main.yaml
# so a single VM-keep-alive on the aspen side covers autobahn runs too.
# Aspen-main provisions 6 replica VMs + 8 client VMs; autobahn (n = 3f+1 = 4
# at f=0) uses the first 4 replicas and all 8 clients.

colocate: false

replica_vms:
  - replica00    # authority 0
  - replica01    # authority 1
  - replica02    # authority 2
  - replica03    # authority 3

# 8 clients striped across 4 authorities (2 clients per authority).
clients:
  - {vm: client00, authority: 0, worker: 0}
  - {vm: client01, authority: 1, worker: 0}
  - {vm: client02, authority: 2, worker: 0}
  - {vm: client03, authority: 3, worker: 0}
  - {vm: client04, authority: 0, worker: 0}
  - {vm: client05, authority: 1, worker: 0}
  - {vm: client06, authority: 2, worker: 0}
  - {vm: client07, authority: 3, worker: 0}

repo:
  url: https://github.com/dqian3/autobahn-artifact.git
  name: autobahn-artifact
  branch: aspen-integration

base_port: 5000
workers: 1

bench:
  faults: 0
  rate: 50000        # total tx/s; split evenly across all 8 clients
  tx_size: 512       # match aspen-main's bench.message_size
  duration: 70       # match aspen-main's bench.duration_secs
  runs: 1

params:
  timeout_delay: 1000
  header_size: 1000
  max_header_delay: 100
  gc_depth: 50
  sync_retry_delay: 5000
  sync_retry_nodes: 3
  batch_size: 500000
  max_batch_delay: 100
  k: 4
  use_fast_path: true
  fast_path_timeout: 500
  use_parallel_proposals: true
  use_optimistic_tips: true
