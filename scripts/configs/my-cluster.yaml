platform: gcloud
project: tiga-project-418019

# Non-colocate mode: primary + workers run on replica VMs,
# benchmark clients run on separate client VMs (8 across 8 regions).
colocate: false

# One VM per authority.
replica_vms:
  - replica0    # authority 0  (us-west1-c)
  - replica1    # authority 1  (us-west4-b)
  - replica2    # authority 2  (us-east1-b)
  - replica3    # authority 3  (us-east4-b)

# 8 clients distributed across 8 regions, striped across 4 authorities.
clients:
  - {vm: client00, authority: 0, worker: 0}
  - {vm: client01, authority: 1, worker: 0}
  - {vm: client02, authority: 2, worker: 0}
  - {vm: client03, authority: 3, worker: 0}
  - {vm: client04, authority: 0, worker: 0}
  - {vm: client05, authority: 1, worker: 0}
  - {vm: client06, authority: 2, worker: 0}
  - {vm: client07, authority: 3, worker: 0}

repo:
  url: https://github.com/dqian3/autobahn-artifact.git
  name: autobahn-artifact
  branch: autobahn-blips-cliauth

base_port: 5000
workers: 1

bench:
  faults: 0
  rate: 50000        # total rate, split evenly across all 8 clients (~6250 tx/s each)
  tx_size: 4096
  duration: 30
  runs: 1

params:
  timeout_delay: 1000
  header_size: 1000
  max_header_delay: 100
  gc_depth: 50
  sync_retry_delay: 5000
  sync_retry_nodes: 3
  batch_size: 500000
  max_batch_delay: 100
  k: 4
  use_fast_path: true
  fast_path_timeout: 500
  use_parallel_proposals: true
  use_optimistic_tips: true
